# Din feed. Ret her, push til GitHub, så bygges siden igen.

title: Min feed
max_age_days: 3        # ældre opslag skjules
max_per_source: 25     # højst så mange opslag fra hver kilde

# Kategorier bliver til filterknapper øverst på siden.
categories:
  musik:   { label: Musik,       color: "#7B5CD6" }
  fodbold: { label: Fodbold,     color: "#C8102E" }
  smil:    { label: Godt humør,  color: "#D99A00" }
  fiskeri: { label: Fiskeri,     color: "#2E6FD1" }
  traening: { label: Træning,    color: "#0F8B8D" }
  friluft: { label: Friluftsliv, color: "#4E8A3E" }
  underholdning: { label: Underholdning, color: "#C2408F" }
  webshops: { label: Nyt i butikkerne, color: "#8A5A2B" }

sources:
  # Nyhedssider: angiv forsiden, så finder scriptet selv RSS-feedet.
  # Virker det ikke, så find feed-adressen og skriv den som  feed: https://...
  - name: Soundvenue
    site: https://soundvenue.com
    category: musik
  - name: Gaffa
    site: https://gaffa.dk
    category: musik

