# Opslag hvor titel eller tekst indeholder disse ord, bliver skjult.
# Store/små bogstaver er ligegyldige. Et * til sidst fanger også bøjninger:
# "dræb*" rammer dræbt, dræber, dræbte. Uden * skal hele ordet passe.
block_words:
  - krig*
  - war
  - wars
  - dræb*
  - drab*
  - killed
  - killing
  - murder*
  - mord*
  - død
  - døde
  - dødsfald
  - dead
  - death
  - dies
  - died
  - terror*
  - skyderi*
  - gunman
  - voldtægt*
  - rape*
  - overgreb*
  - abuse*
  - racis*
  - selvmord*
  - suicide
  - kræft*
  - cancer
  - ulykke*
  - crash*
  - krise*
  - crisis
